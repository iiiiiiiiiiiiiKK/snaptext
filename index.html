<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>SnapText — 图片转可编辑文字 / Turn images into editable text</title>
    <meta
      name="description"
      content="SnapText 在浏览器本地把图片里的文字变成可编辑文本，支持中英文 OCR、区域识别、批量处理。图片不会上传到任何服务器。"
    />
    <meta name="theme-color" content="#0c0f15" />
    <meta property="og:title" content="SnapText — 让图片里的文字重新变得可编辑" />
    <meta property="og:description" content="100% 浏览器本地 OCR。不上传图片，不需要注册，不依赖付费 API。" />
    <meta property="og:type" content="website" />
    <script>
      // Apply the persisted theme before first paint to avoid a light/dark flash.
      try {
        var stored = localStorage.getItem('snaptext.theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
